[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-guard"
version = "1.0.0"
description = "Local static security checks for GitHub Actions workflows with source locations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "megern"}]
dependencies = ["PyYAML>=6.0.3,<7"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Environment :: Console",
]

[project.urls]
Repository = "https://github.com/megern/workflow-guard"
Issues = "https://github.com/megern/workflow-guard/issues"

[project.scripts]
workflow-guard-project = "workflow_guard.project:main"
workflow-guard = "workflow_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
